<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DashLens — DoorDash Photo Compliance Studio</title>
  <!-- Load imgly background removal library via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
  <style>
    :root{
      --brand-primary:#eb1700;
      --brand-primary-700:#c91400;
      --brand-bg:#f7f7f8;
      --surface:#ffffff;
      --surface-2:#f2f3f5;
      --text-primary:#191919;
      --text-secondary:#60646c;
      --success:#0a8f5b;
      --danger:#b42318;
      --border:#e6e7eb;
      --shadow:0 8px 24px rgba(25,25,25,0.08);
      --radius-lg:16px;
      --radius-md:12px;
      --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:var(--brand-bg);color:var(--text-primary)}
    .app{width:100%;max-width:1200px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:18px}
    header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 20px;border-radius:var(--radius-lg);border:1px solid var(--border)}
    .brand{font-weight:700;display:flex;align-items:center;gap:10px}
    .logo{width:28px;height:28px;background:var(--brand-primary);border-radius:6px}
    main{display:grid;grid-template-columns:340px 1fr;gap:18px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
    .field{margin-bottom:14px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    select, .btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:14px}
    .btn{background:var(--brand-primary);color:#fff;font-weight:700;cursor:pointer;border:none;margin-top:10px}
    .btn:disabled{background:#ccc;cursor:not-allowed}
    .dropzone{border:2px dashed #ffb1a6;border-radius:12px;background:#fff8f7;padding:20px;text-align:center;cursor:pointer}
    .workspace{display:flex;flex-direction:column;gap:14px}
    .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;padding:12px}
    .frame{position:relative;width:100%;aspect-ratio:16/9;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}
    .frame canvas, .frame img{width:100%;height:100%;object-fit:cover}
    .loader{position:absolute;inset:0;background:rgba(255,255,255,0.85);display:none;place-items:center;font-weight:600;color:var(--brand-primary)}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="logo"></div> DashLens Studio</div>
      <span>DoorDash Compliance Tool</span>
    </header>

    <main>
      <section class="panel">
        <h2>Setup & Options</h2>
        <div class="field">
          <label>Upload Image</label>
          <div class="dropzone" id="dropzone">Drop photo or click to upload</div>
          <input type="file" id="images" accept="image/*" style="display:none" />
        </div>

        <div class="field">
          <label for="foodBg">Select Compliance Background</label>
          <select id="foodBg">
            <option value="marble">2. Marble (Default)</option>
            <option value="slate">1. Slate</option>
            <option value="wood">3. Wood</option>
            <option value="white">4. Matte White</option>
            <option value="original">Keep Original Background</option>
          </select>
        </div>

        <button class="btn" id="processBtn" disabled>Process & Remove Background</button>
        <button class="btn" id="downloadBtn" style="background:#0a8f5b; display:none;">Download 16:9 Image</button>
      </section>

      <section class="workspace">
        <div class="preview-grid">
          <div class="card">
            <h3>Source Image</h3>
            <div class="frame"><img id="sourceImg" src="" alt="Source preview" /></div>
          </div>
          <div class="card">
            <h3>Final Compliant Output (16:9)</h3>
            <div class="frame">
              <canvas id="outputCanvas" width="1280" height="720"></canvas>
              <div class="loader" id="loader">Processing AI Segmentation...</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const imagesInput = document.getElementById('images');
    const sourceImg = document.getElementById('sourceImg');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const foodBg = document.getElementById('foodBg');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const loader = document.getElementById('loader');

    let loadedFile = null;

    dropzone.addEventListener('click', () => imagesInput.click());
    imagesInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        loadedFile = e.target.files[0];
        sourceImg.src = URL.createObjectURL(loadedFile);
        processBtn.disabled = false;
        drawInitialCanvas(sourceImg.src);
      }
    });

    // Draw standard 16:9 cropped canvas
    function drawInitialCanvas(imageSrc) {
      const img = new Image();
      img.src = imageSrc;
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground(foodBg.value);
        // Center crop image to 16:9
        drawCenteredImage(img);
      };
    }

    function drawBackground(type) {
      if (type === 'marble') {
        ctx.fillStyle = '#e8e8e8';
      } else if (type === 'slate') {
        ctx.fillStyle = '#2f3542';
      } else if (type === 'wood') {
        ctx.fillStyle = '#8a5a36';
      } else {
        ctx.fillStyle = '#ffffff';
      }
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawCenteredImage(img) {
      const hRatio = canvas.width / img.width;
      const vRatio = canvas.height / img.height;
      const ratio = Math.max(hRatio, vRatio);
      const centerShift_x = (canvas.width - img.width * ratio) / 2;
      const centerShift_y = (canvas.height - img.height * ratio) / 2;
      ctx.drawImage(img, 0, 0, img.width, img.height, centerShift_x, centerShift_y, img.width * ratio, img.height * ratio);
    }

    processBtn.addEventListener('click', async () => {
      if (!loadedFile) return;
      
      if (foodBg.value === 'original') {
        drawInitialCanvas(sourceImg.src);
        downloadBtn.style.display = 'block';
        return;
      }

      loader.style.display = 'grid';
      processBtn.disabled = true;

      try {
        // AI Background removal execution
        const blob = await imglyRemoveBackground(loadedFile);
        const removedBgUrl = URL.createObjectURL(blob);
        
        const cutoutImg = new Image();
        cutoutImg.src = removedBgUrl;
        cutoutImg.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawBackground(foodBg.value);
          
          // Draw cutout centered and scaled to 75% height for compliance
          const scale = (canvas.height * 0.75) / cutoutImg.height;
          const x = (canvas.width - cutoutImg.width * scale) / 2;
          const y = (canvas.height - cutoutImg.height * scale) / 2;
          
          ctx.drawImage(cutoutImg, x, y, cutoutImg.width * scale, cutoutImg.height * scale);
          
          loader.style.display = 'none';
          processBtn.disabled = false;
          downloadBtn.style.display = 'block';
        };
      } catch (err) {
        alert('Error removing background. Please try a clearer image or keep original background.');
        loader.style.display = 'none';
        processBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'dashlens-16x9-compliant.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  </script>
</body>
</html>
